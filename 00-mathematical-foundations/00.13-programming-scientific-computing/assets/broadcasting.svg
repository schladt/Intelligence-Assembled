<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Broadcasting aligns dimensions from the trailing side</title>
  <desc id="desc">The upper example aligns shapes five by one by four and three by four to produce five by three by four. The lower example marks a mismatch between trailing dimensions three and two.</desc>
  <rect width="800" height="480" fill="#f5f7f2"/>
  <text x="40" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#1b2a30">Align from the right</text>
  <text x="40" y="75" font-family="sans-serif" font-size="16" fill="#455a64">Each aligned pair must be equal or contain a 1.</text>
  <g font-family="monospace" font-size="27" text-anchor="middle">
    <text x="150" y="145">(5, 1, 4)</text><text x="150" y="200">(   3, 4)</text><text x="150" y="275">(5, 3, 4)</text>
    <text x="500" y="145">(2, 3)</text><text x="500" y="200">(   2)</text><text x="500" y="275">no result</text>
  </g>
  <line x1="65" y1="220" x2="235" y2="220" stroke="#263238" stroke-width="2"/>
  <line x1="420" y1="220" x2="580" y2="220" stroke="#263238" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <rect x="83" y="305" width="82" height="48" rx="5" fill="#d9efe2" stroke="#2e7d32"/><text x="124" y="335">5 vs 1</text>
    <rect x="172" y="305" width="82" height="48" rx="5" fill="#d9efe2" stroke="#2e7d32"/><text x="213" y="335">1 vs 3</text>
    <rect x="261" y="305" width="82" height="48" rx="5" fill="#d9efe2" stroke="#2e7d32"/><text x="302" y="335">4 vs 4</text>
    <text x="213" y="385" fill="#2e7d32" font-size="19" font-weight="700">compatible</text>
    <rect x="435" y="305" width="130" height="48" rx="5" fill="#fde2df" stroke="#b23a48" stroke-width="2"/><text x="478" y="335">3 vs 2</text>
    <path d="M535 320 L551 338 M551 320 L535 338" stroke="#b23a48" stroke-width="3"/>
    <text x="500" y="385" fill="#9b2226" font-size="19" font-weight="700">incompatible</text>
  </g>
  <text x="400" y="440" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#455a64">Missing leading axes behave as length 1; trailing mismatches cannot be repaired.</text>
</svg>