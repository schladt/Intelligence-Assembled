<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Computational contract ledger</title>
  <desc id="desc">Four horizontal layers show input meaning, representation, execution context, and evidence. Arrows indicate that each layer constrains the resulting computational claim.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#37474f"/></marker></defs>
  <rect width="800" height="480" fill="#faf7f0"/>
  <text x="40" y="45" font-family="sans-serif" font-size="25" font-weight="700" fill="#17252a">A number inherits every upstream contract</text>
  <g font-family="sans-serif">
    <rect x="55" y="85" width="690" height="70" rx="6" fill="#d7eef2" stroke="#16697a" stroke-width="2"/>
    <text x="80" y="115" font-size="19" font-weight="700">Input meaning</text><text x="80" y="140" font-size="15">values, types, axis meanings, units, data provenance</text>
    <rect x="55" y="180" width="690" height="70" rx="6" fill="#e6eed5" stroke="#5f6f24" stroke-width="2"/>
    <text x="80" y="210" font-size="19" font-weight="700">Representation</text><text x="80" y="235" font-size="15">shape, dtype, strides, views, copies, mutable state</text>
    <rect x="55" y="275" width="690" height="70" rx="6" fill="#f6e3bd" stroke="#a66321" stroke-width="2"/>
    <text x="80" y="305" font-size="19" font-weight="700">Execution context</text><text x="80" y="330" font-size="15">code, command, dependencies, versions, process, hardware</text>
    <rect x="55" y="370" width="690" height="70" rx="6" fill="#eadcf1" stroke="#6a4c79" stroke-width="2"/>
    <text x="80" y="400" font-size="19" font-weight="700">Evidence and limits</text><text x="80" y="425" font-size="15">tests, invariants, references, plots, profiles, unresolved gaps</text>
  </g>
  <path d="M700 155 V178" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/><path d="M700 250 V273" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/><path d="M700 345 V368" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
</svg>