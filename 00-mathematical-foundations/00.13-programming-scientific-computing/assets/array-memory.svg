<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Array shape, byte strides, views, and copies</title>
  <desc id="desc">A two by three row-major array maps to six float64 buffer cells. Arrows show 24 bytes between rows and 8 bytes between columns. Basic slicing shares the buffer while advanced indexing copies selected values.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#263238"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#8d6e63" stroke-width="2"/></pattern>
  </defs>
  <rect width="800" height="480" fill="#f7f4ed"/>
  <text x="40" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#17252a">Logical array and physical buffer</text>
  <text x="40" y="75" font-family="sans-serif" font-size="16" fill="#37474f">shape (2, 3), dtype float64, itemsize 8 bytes, strides (24, 8)</text>
  <g font-family="monospace" font-size="20" text-anchor="middle">
    <g fill="#d7eef2" stroke="#16697a" stroke-width="2">
      <rect x="70" y="115" width="90" height="62"/><rect x="160" y="115" width="90" height="62"/><rect x="250" y="115" width="90" height="62"/>
      <rect x="70" y="177" width="90" height="62"/><rect x="160" y="177" width="90" height="62"/><rect x="250" y="177" width="90" height="62"/>
    </g>
    <text x="115" y="153">a00</text><text x="205" y="153">a01</text><text x="295" y="153">a02</text>
    <text x="115" y="215">a10</text><text x="205" y="215">a11</text><text x="295" y="215">a12</text>
  </g>
  <path d="M115 104 H205" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><text x="160" y="98" font-family="sans-serif" font-size="14" text-anchor="middle">+8 bytes</text>
  <path d="M52 146 V208" stroke="#263238" stroke-width="2" marker-end="url(#arrow)"/><text x="18" y="180" font-family="sans-serif" font-size="14" transform="rotate(-90 18 180)" text-anchor="middle">+24 bytes</text>
  <g font-family="monospace" font-size="17" text-anchor="middle">
    <text x="535" y="105" font-family="sans-serif" font-size="17" font-weight="700">contiguous data buffer</text>
    <g stroke="#455a64" stroke-width="2">
      <rect x="410" y="125" width="80" height="55" fill="#d7eef2"/><rect x="490" y="125" width="80" height="55" fill="#d7eef2"/><rect x="570" y="125" width="80" height="55" fill="#d7eef2"/>
      <rect x="410" y="180" width="80" height="55" fill="#d7eef2"/><rect x="490" y="180" width="80" height="55" fill="#d7eef2"/><rect x="570" y="180" width="80" height="55" fill="#d7eef2"/>
    </g>
    <text x="450" y="159">a00</text><text x="530" y="159">a01</text><text x="610" y="159">a02</text>
    <text x="450" y="214">a10</text><text x="530" y="214">a11</text><text x="610" y="214">a12</text>
  </g>
  <path d="M205 255 C205 300 165 310 165 345" fill="none" stroke="#16697a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M530 255 C530 300 610 310 610 345" fill="none" stroke="#8d6e63" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <rect x="65" y="350" width="250" height="88" rx="6" fill="#e4f3e8" stroke="#2e7d32" stroke-width="2"/>
  <text x="190" y="380" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">basic slice: view</text>
  <text x="190" y="408" font-family="sans-serif" font-size="15" text-anchor="middle">new metadata, shared buffer</text>
  <path d="M92 421 H288" stroke="#2e7d32" stroke-width="5"/>
  <rect x="485" y="350" width="250" height="88" rx="6" fill="url(#hatch)" stroke="#8d6e63" stroke-width="2"/>
  <text x="610" y="380" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#3e2723">advanced index: copy</text>
  <text x="610" y="408" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#3e2723">new metadata and new buffer</text>
</svg>