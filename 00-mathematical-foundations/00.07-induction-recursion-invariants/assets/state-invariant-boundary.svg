<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Invariant boundary containing reachable and unreachable states</title>
  <desc id="desc">An oval invariant region contains a solid path of reachable states and several striped but unreachable states. Crossed unsafe states lie outside. A blocked dashed transition shows that preservation prevents leaving the invariant.</desc>
  <defs>
    <pattern id="stripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#fffdf7"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#777" stroke-width="2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fcfaf5"/>
  <text x="48" y="48" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#172126">An invariant is a safe boundary, not an exact map</text>
  <text x="48" y="78" font-family="Verdana, sans-serif" font-size="15" fill="#40515a">Every reachable state satisfies I, but some I-states may remain unreachable.</text>

  <ellipse cx="455" cy="335" rx="355" ry="205" fill="#e9f2ed" stroke="#1d6b56" stroke-width="5"/>
  <text x="160" y="162" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#164d40">Invariant region I(s)</text>

  <g stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="205" y1="330" x2="306" y2="286"/>
    <line x1="350" y1="270" x2="449" y2="304"/>
    <line x1="495" y1="318" x2="594" y2="276"/>
  </g>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <circle cx="175" cy="343" r="34" fill="#ffffff" stroke="#1d6b56" stroke-width="4"/>
    <text x="175" y="338" font-size="13" font-weight="700">START</text>
    <text x="175" y="357" font-size="14">s₀</text>
    <circle cx="330" cy="276" r="34" fill="#ffffff" stroke="#1d6b56" stroke-width="4"/>
    <text x="330" y="282" font-size="15">s₁</text>
    <circle cx="472" cy="312" r="34" fill="#ffffff" stroke="#1d6b56" stroke-width="4"/>
    <text x="472" y="318" font-size="15">s₂</text>
    <circle cx="620" cy="266" r="34" fill="#ffffff" stroke="#1d6b56" stroke-width="4"/>
    <text x="620" y="272" font-size="15">s₃</text>

    <circle cx="300" cy="445" r="34" fill="url(#stripe)" stroke="#555" stroke-width="3"/>
    <text x="300" y="451" font-size="15">u₁</text>
    <circle cx="510" cy="455" r="34" fill="url(#stripe)" stroke="#555" stroke-width="3"/>
    <text x="510" y="461" font-size="15">u₂</text>
    <circle cx="695" cy="392" r="34" fill="url(#stripe)" stroke="#555" stroke-width="3"/>
    <text x="695" y="398" font-size="15">u₃</text>
  </g>
  <text x="455" y="497" font-family="Verdana, sans-serif" text-anchor="middle" font-size="14" fill="#40515a">striped: satisfies I, not reached by this execution system</text>

  <path d="M644 246 C740 190 805 165 850 175" fill="none" stroke="#a23b2a" stroke-width="4" stroke-dasharray="10 7"/>
  <line x1="748" y1="182" x2="774" y2="214" stroke="#a23b2a" stroke-width="5"/>
  <line x1="774" y1="182" x2="748" y2="214" stroke="#a23b2a" stroke-width="5"/>
  <circle cx="860" cy="172" r="34" fill="#fff2ee" stroke="#a23b2a" stroke-width="4"/>
  <line x1="839" y1="151" x2="881" y2="193" stroke="#a23b2a" stroke-width="4"/>
  <line x1="881" y1="151" x2="839" y2="193" stroke="#a23b2a" stroke-width="4"/>
  <text x="800" y="126" font-family="Verdana, sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#7b291f">preservation blocks exit</text>
  <text x="805" y="228" font-family="Verdana, sans-serif" font-size="14" fill="#7b291f">unsafe: I false</text>

  <rect x="690" y="505" width="222" height="60" rx="6" fill="#ffffff" stroke="#263238" stroke-width="2"/>
  <text x="801" y="530" font-family="Verdana, sans-serif" text-anchor="middle" font-size="14" font-weight="700" fill="#172126">Required direction</text>
  <text x="801" y="552" font-family="Verdana, sans-serif" text-anchor="middle" font-size="16" fill="#172126">Reach ⊆ I</text>
</svg>
