<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Structural induction on a binary expression tree</title>
  <desc id="desc">A multiplication root has an addition subtree and a number leaf. Separate labels IH one and IH two show that each recursive child supplies its own inductive hypothesis before the parent constructor case is proved.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#263238"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#28627a"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="#fbfcf8"/>
  <text x="48" y="48" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#172126">One hypothesis for every recursive child</text>
  <text x="48" y="78" font-family="Verdana, sans-serif" font-size="15" fill="#40515a">Expression: Multiply(Add(Number(2), Number(3)), Number(4))</text>

  <g stroke="#263238" stroke-width="4" fill="none">
    <line x1="480" y1="150" x2="300" y2="270"/>
    <line x1="480" y1="150" x2="700" y2="270"/>
    <line x1="300" y1="330" x2="185" y2="445"/>
    <line x1="300" y1="330" x2="415" y2="445"/>
  </g>

  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <rect x="385" y="105" width="190" height="76" rx="6" fill="#e7f2ed" stroke="#1d6b56" stroke-width="3"/>
    <text x="480" y="134" font-size="13" font-weight="700" fill="#164d40">BINARY CONSTRUCTOR</text>
    <text x="480" y="161" font-size="19" fill="#172126">Multiply</text>

    <rect x="220" y="270" width="160" height="64" rx="6" fill="#ffffff" stroke="#28627a" stroke-width="3"/>
    <text x="300" y="297" font-size="13" font-weight="700" fill="#205269">LEFT CHILD</text>
    <text x="300" y="320" font-size="18" fill="#172126">Add</text>

    <rect x="620" y="270" width="160" height="64" rx="6" fill="url(#dots)" stroke="#28627a" stroke-width="3"/>
    <text x="700" y="297" font-size="13" font-weight="700" fill="#205269">RIGHT CHILD</text>
    <text x="700" y="320" font-size="18" fill="#172126">Number(4)</text>

    <rect x="112" y="445" width="146" height="58" rx="6" fill="url(#dots)" stroke="#28627a" stroke-width="3"/>
    <text x="185" y="480" font-size="17" fill="#172126">Number(2)</text>
    <rect x="342" y="445" width="146" height="58" rx="6" fill="url(#dots)" stroke="#28627a" stroke-width="3"/>
    <text x="415" y="480" font-size="17" fill="#172126">Number(3)</text>
  </g>

  <path d="M300 355 C300 390 350 380 395 220" fill="none" stroke="#b15b32" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
  <path d="M700 355 C700 400 610 360 565 220" fill="none" stroke="#6a4c93" stroke-width="4" stroke-dasharray="3 7" marker-end="url(#arrow)"/>
  <rect x="228" y="368" width="122" height="44" rx="5" fill="#fff5ec" stroke="#b15b32" stroke-width="2"/>
  <text x="289" y="395" font-family="Verdana, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3b20">IH 1: P(left)</text>
  <rect x="610" y="368" width="132" height="44" rx="5" fill="#f4eff9" stroke="#6a4c93" stroke-width="2"/>
  <text x="676" y="395" font-family="Verdana, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#4e376f">IH 2: P(right)</text>

  <rect x="270" y="530" width="420" height="48" rx="6" fill="#ffffff" stroke="#263238" stroke-width="2"/>
  <text x="480" y="560" font-family="Verdana, sans-serif" text-anchor="middle" font-size="16" fill="#172126">P(left) + P(right) + constructor rule ⇒ P(parent)</text>
</svg>
