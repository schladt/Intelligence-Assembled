<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">An inequality contract from assumptions to equality audit</title>
  <desc id="desc">Three columns connect available assumptions to an inequality and then to its direction and equality conditions. A failed assumption exits to a refusal box.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#263238"/>
    </marker>
    <style>
      .heading { font: 700 20px Georgia, serif; fill: #172126; }
      .label { font: 16px Georgia, serif; fill: #172126; }
      .small { font: 14px Georgia, serif; fill: #263238; }
      .box { stroke: #263238; stroke-width: 2; rx: 6; }
      .link { fill: none; stroke: #263238; stroke-width: 2.5; marker-end: url(#arrow); }
      .refuse { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="900" height="430" fill="#f7f5ef"/>
  <text x="450" y="35" text-anchor="middle" class="heading">Read the contract before using the bound</text>

  <rect x="45" y="75" width="220" height="220" class="box" fill="#dcefe4"/>
  <text x="155" y="108" text-anchor="middle" class="heading">Assumptions</text>
  <text x="70" y="145" class="label">• domain and signs</text>
  <text x="70" y="180" class="label">• finite dimensions</text>
  <text x="70" y="215" class="label">• weights or exponents</text>
  <text x="70" y="250" class="label">• convexity or order</text>

  <rect x="340" y="105" width="220" height="160" class="box" fill="#f4d58d"/>
  <text x="450" y="143" text-anchor="middle" class="heading">Inequality</text>
  <text x="450" y="183" text-anchor="middle" class="label">named theorem</text>
  <text x="450" y="215" text-anchor="middle" class="small">with a licensed direction</text>

  <rect x="635" y="75" width="220" height="220" class="box" fill="#d9e6f2"/>
  <text x="745" y="108" text-anchor="middle" class="heading">Audit</text>
  <text x="660" y="150" class="label">1. needed direction?</text>
  <text x="660" y="190" class="label">2. equality geometry?</text>
  <text x="660" y="230" class="label">3. next operation safe?</text>
  <text x="660" y="270" class="label">4. proof or finite check?</text>

  <path d="M265 185 H330" class="link"/>
  <path d="M560 185 H625" class="link"/>

  <rect x="340" y="330" width="220" height="76" class="box" fill="#f3c7c2"/>
  <text x="450" y="359" text-anchor="middle" class="heading">Refuse this theorem</text>
  <text x="450" y="383" text-anchor="middle" class="small">repair the assumptions</text>
  <text x="450" y="400" text-anchor="middle" class="small">or choose another theorem</text>
  <path d="M155 295 V370 H330" class="link refuse"/>
  <text x="176" y="330" class="small">contract fails</text>
</svg>