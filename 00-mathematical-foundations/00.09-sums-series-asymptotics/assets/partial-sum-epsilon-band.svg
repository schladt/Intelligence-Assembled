<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Partial sums eventually remain inside an epsilon band</title>
  <desc id="desc">A sequence plot shows early partial sums outside a horizontal band around limit S. After threshold N, every circular point lies between dashed lines S minus epsilon and S plus epsilon.</desc>
  <defs>
    <style>
      .axis { stroke: #25313c; stroke-width: 2; }
      .guide { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 10 8; }
      .limit { stroke: #0f766e; stroke-width: 3; }
      .path { fill: none; stroke: #2456a6; stroke-width: 2.5; }
      .point { fill: #ffffff; stroke: #2456a6; stroke-width: 3; }
      .threshold { stroke: #b45309; stroke-width: 3; stroke-dasharray: 4 7; }
      .label { fill: #18222d; font: 20px Georgia, serif; }
      .small { fill: #374151; font: 17px Georgia, serif; }
      .note { fill: #7c2d12; font: 17px Georgia, serif; }
    </style>
    <pattern id="band" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0" stroke="#99d5cf" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="500" fill="#fbfcf8"/>
  <rect x="85" y="170" width="745" height="140" fill="url(#band)" opacity="0.7"/>
  <line class="axis" x1="85" y1="420" x2="840" y2="420"/>
  <line class="axis" x1="85" y1="55" x2="85" y2="430"/>
  <line class="guide" x1="85" y1="170" x2="830" y2="170"/>
  <line class="limit" x1="85" y1="240" x2="830" y2="240"/>
  <line class="guide" x1="85" y1="310" x2="830" y2="310"/>
  <line class="threshold" x1="365" y1="75" x2="365" y2="420"/>
  <polyline class="path" points="130,350 205,120 280,330 350,145 420,285 490,205 560,267 630,220 700,254 770,230"/>
  <g>
    <circle class="point" cx="130" cy="350" r="7"/>
    <circle class="point" cx="205" cy="120" r="7"/>
    <circle class="point" cx="280" cy="330" r="7"/>
    <circle class="point" cx="350" cy="145" r="7"/>
    <circle class="point" cx="420" cy="285" r="7"/>
    <circle class="point" cx="490" cy="205" r="7"/>
    <circle class="point" cx="560" cy="267" r="7"/>
    <circle class="point" cx="630" cy="220" r="7"/>
    <circle class="point" cx="700" cy="254" r="7"/>
    <circle class="point" cx="770" cy="230" r="7"/>
  </g>
  <text class="label" x="745" y="405">index n</text>
  <text class="label" x="28" y="67">S_N</text>
  <text class="small" x="700" y="160">S + epsilon</text>
  <text class="small" x="793" y="232">S</text>
  <text class="small" x="700" y="333">S - epsilon</text>
  <text class="note" x="344" y="64">threshold N</text>
  <text class="small" x="115" y="468">Early terms may leave the band</text>
  <text class="small" x="488" y="468">Every point after N stays inside</text>
</svg>