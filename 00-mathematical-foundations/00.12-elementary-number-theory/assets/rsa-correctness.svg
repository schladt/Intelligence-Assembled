<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">RSA correctness split across two prime moduli</title>
  <desc id="desc">A message raised to the product of public and private exponents branches into modulo p and modulo q checks. Each branch has a zero case when the prime divides the message and a Fermat case otherwise. The equalities recombine through CRT to recover the message modulo n.</desc>
  <rect width="960" height="520" fill="#f5f6f2"/>
  <text x="48" y="52" font-family="Georgia, serif" font-size="29" fill="#17212b">Correctness needs the zero branches</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5560"/></marker></defs>
  <g fill="#ffffff" stroke="#17212b" stroke-width="2">
    <rect x="280" y="78" width="400" height="54" rx="6"/>
    <rect x="92" y="182" width="330" height="62" rx="6"/>
    <rect x="538" y="182" width="330" height="62" rx="6"/>
    <rect x="74" y="306" width="180" height="68" rx="6"/>
    <rect x="276" y="306" width="180" height="68" rx="6"/>
    <rect x="504" y="306" width="180" height="68" rx="6"/>
    <rect x="706" y="306" width="180" height="68" rx="6"/>
    <rect x="310" y="430" width="340" height="56" rx="6"/>
  </g>
  <g fill="none" stroke="#4b5560" stroke-width="2" marker-end="url(#arrow)">
    <path d="M430 132 L300 182"/><path d="M530 132 L660 182"/>
    <path d="M220 244 L165 306"/><path d="M330 244 L365 306"/>
    <path d="M630 244 L595 306"/><path d="M740 244 L795 306"/>
    <path d="M165 374 C165 420 390 405 420 430"/><path d="M365 374 L445 430"/>
    <path d="M595 374 L515 430"/><path d="M795 374 C795 420 570 405 540 430"/>
  </g>
  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#17212b">
    <text x="480" y="112" font-size="16">m^(ed), with ed = 1 mod phi(n)</text>
    <text x="257" y="208" font-size="18">work modulo p</text><text x="257" y="232" font-size="13">p is prime</text>
    <text x="703" y="208" font-size="18">work modulo q</text><text x="703" y="232" font-size="13">q is prime</text>
    <text x="164" y="332" font-size="15">p divides m</text><text x="164" y="357" font-size="13">both sides are 0</text>
    <text x="366" y="332" font-size="15">p does not divide m</text><text x="366" y="357" font-size="13">use Fermat</text>
    <text x="594" y="332" font-size="15">q divides m</text><text x="594" y="357" font-size="13">both sides are 0</text>
    <text x="796" y="332" font-size="15">q does not divide m</text><text x="796" y="357" font-size="13">use Fermat</text>
    <text x="480" y="455" font-size="18">CRT: m^(ed) = m mod pq</text>
    <text x="480" y="476" font-size="12" fill="#4b5560">covers units, multiples of p or q, and zero</text>
  </g>
</svg>