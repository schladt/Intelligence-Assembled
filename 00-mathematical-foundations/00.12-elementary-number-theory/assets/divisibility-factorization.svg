<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Prime factorization and divisor exponents for 360</title>
  <desc id="desc">A factor tree decomposes 360 into 2 cubed times 3 squared times 5. Beside it, three labeled exponent tracks show that every positive divisor chooses one exponent from zero through three for 2, zero through two for 3, and zero through one for 5.</desc>
  <rect width="960" height="520" fill="#f7f5ef"/>
  <text x="48" y="52" font-family="Georgia, serif" font-size="30" fill="#17212b">Factorization is a coordinate system</text>
  <text x="48" y="84" font-family="Verdana, sans-serif" font-size="15" fill="#4b5560">360 = 2^3 x 3^2 x 5</text>
  <g stroke="#4b5560" stroke-width="2" fill="none">
    <path d="M205 140 L125 210 M205 140 L285 210"/>
    <path d="M285 210 L235 280 M285 210 L335 280"/>
    <path d="M335 280 L295 350 M335 280 L375 350"/>
    <path d="M375 350 L345 420 M375 350 L405 420"/>
    <path d="M405 420 L385 474 M405 420 L425 474"/>
  </g>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#17212b" stroke-width="2">
      <circle cx="205" cy="140" r="32"/><circle cx="125" cy="210" r="27"/><circle cx="285" cy="210" r="27"/>
      <circle cx="235" cy="280" r="25"/><circle cx="335" cy="280" r="25"/><circle cx="295" cy="350" r="23"/>
      <circle cx="375" cy="350" r="23"/><circle cx="345" cy="420" r="21"/><circle cx="405" cy="420" r="21"/>
      <circle cx="385" cy="474" r="18"/><circle cx="425" cy="474" r="18"/>
    </g>
    <g font-size="17" fill="#17212b">
      <text x="205" y="146">360</text><text x="125" y="216">2</text><text x="285" y="216">180</text>
      <text x="235" y="286">2</text><text x="335" y="286">90</text><text x="295" y="356">2</text>
      <text x="375" y="356">45</text><text x="345" y="426">5</text><text x="405" y="426">9</text>
      <text x="385" y="480">3</text><text x="425" y="480">3</text>
    </g>
  </g>
  <line x1="485" y1="112" x2="485" y2="466" stroke="#b8b1a4" stroke-width="2"/>
  <text x="535" y="137" font-family="Georgia, serif" font-size="23" fill="#17212b">Choose divisor exponents</text>
  <g font-family="Verdana, sans-serif">
    <text x="535" y="202" font-size="18" fill="#17212b">power of 2</text>
    <line x1="660" y1="196" x2="865" y2="196" stroke="#176b6b" stroke-width="6"/>
    <g fill="#176b6b" stroke="#ffffff" stroke-width="2">
      <circle cx="680" cy="196" r="13"/><circle cx="735" cy="196" r="13"/><circle cx="790" cy="196" r="13"/><circle cx="845" cy="196" r="13"/>
    </g>
    <g text-anchor="middle" font-size="14" fill="#17212b"><text x="680" y="229">0</text><text x="735" y="229">1</text><text x="790" y="229">2</text><text x="845" y="229">3</text></g>
    <text x="535" y="300" font-size="18" fill="#17212b">power of 3</text>
    <line x1="660" y1="294" x2="810" y2="294" stroke="#b84a3a" stroke-width="6"/>
    <g fill="#b84a3a" stroke="#ffffff" stroke-width="2"><circle cx="680" cy="294" r="13"/><circle cx="735" cy="294" r="13"/><circle cx="790" cy="294" r="13"/></g>
    <g text-anchor="middle" font-size="14" fill="#17212b"><text x="680" y="327">0</text><text x="735" y="327">1</text><text x="790" y="327">2</text></g>
    <text x="535" y="398" font-size="18" fill="#17212b">power of 5</text>
    <line x1="660" y1="392" x2="755" y2="392" stroke="#6b4c8a" stroke-width="6"/>
    <g fill="#6b4c8a" stroke="#ffffff" stroke-width="2"><circle cx="680" cy="392" r="13"/><circle cx="735" cy="392" r="13"/></g>
    <g text-anchor="middle" font-size="14" fill="#17212b"><text x="680" y="425">0</text><text x="735" y="425">1</text></g>
    <text x="535" y="472" font-size="16" fill="#4b5560">4 x 3 x 2 = 24 positive divisors</text>
  </g>
</svg>