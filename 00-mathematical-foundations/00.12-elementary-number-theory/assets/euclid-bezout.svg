<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Euclidean algorithm and Bezout back-substitution</title>
  <desc id="desc">Three rows show 252 split into two blocks of 105 plus 42, then 105 split into two blocks of 42 plus 21, then 42 split into two blocks of 21. Arrows lead backward to the identity 21 equals five times 105 minus two times 252.</desc>
  <rect width="960" height="520" fill="#f4f7f8"/>
  <text x="48" y="52" font-family="Georgia, serif" font-size="30" fill="#17212b">Shrink forward, substitute backward</text>
  <g font-family="Verdana, sans-serif" font-size="16" fill="#17212b">
    <text x="48" y="122">252 = 2(105) + 42</text>
    <rect x="265" y="96" width="250" height="42" fill="#176b6b"/><rect x="518" y="96" width="250" height="42" fill="#176b6b"/><rect x="771" y="96" width="100" height="42" fill="#f2b84b"/>
    <text x="390" y="123" text-anchor="middle" fill="#ffffff">105</text><text x="643" y="123" text-anchor="middle" fill="#ffffff">105</text><text x="821" y="123" text-anchor="middle">42</text>
    <text x="48" y="220">105 = 2(42) + 21</text>
    <rect x="265" y="194" width="200" height="42" fill="#f2b84b"/><rect x="468" y="194" width="200" height="42" fill="#f2b84b"/><rect x="671" y="194" width="100" height="42" fill="#b84a3a"/>
    <text x="365" y="221" text-anchor="middle">42</text><text x="568" y="221" text-anchor="middle">42</text><text x="721" y="221" text-anchor="middle" fill="#ffffff">21</text>
    <text x="48" y="318">42 = 2(21) + 0</text>
    <rect x="265" y="292" width="190" height="42" fill="#b84a3a"/><rect x="458" y="292" width="190" height="42" fill="#b84a3a"/>
    <text x="360" y="319" text-anchor="middle" fill="#ffffff">21</text><text x="553" y="319" text-anchor="middle" fill="#ffffff">21</text>
  </g>
  <g fill="none" stroke="#4b5560" stroke-width="2" marker-end="url(#arrow)">
    <path d="M720 352 C720 390 640 390 640 420"/>
    <path d="M820 154 C890 230 865 350 760 420" stroke-dasharray="7 5"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5560"/></marker></defs>
  <rect x="190" y="410" width="610" height="72" rx="6" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <text x="495" y="442" text-anchor="middle" font-family="Georgia, serif" font-size="23" fill="#17212b">21 = 105 - 2(42) = 5(105) - 2(252)</text>
  <text x="495" y="468" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#4b5560">The final remainder becomes a Bezout certificate.</text>
</svg>