<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Residue classes modulo five and a CRT intersection</title>
  <desc id="desc">Five horizontal rows group integers by remainder modulo five. A panel on the right lists numbers congruent to two modulo six and eight modulo nine; the common value eight repeats every eighteen.</desc>
  <rect width="960" height="520" fill="#faf7f2"/>
  <text x="42" y="50" font-family="Georgia, serif" font-size="29" fill="#17212b">Classes partition; CRT intersects</text>
  <text x="42" y="80" font-family="Verdana, sans-serif" font-size="14" fill="#4b5560">Representatives differ. Classes agree.</text>
  <g font-family="Verdana, sans-serif" font-size="15">
    <g fill="#17212b"><text x="50" y="138">[0]5</text><text x="50" y="205">[1]5</text><text x="50" y="272">[2]5</text><text x="50" y="339">[3]5</text><text x="50" y="406">[4]5</text></g>
    <g stroke-width="2">
      <line x1="115" y1="132" x2="530" y2="132" stroke="#176b6b"/>
      <line x1="115" y1="199" x2="530" y2="199" stroke="#b84a3a" stroke-dasharray="8 4"/>
      <line x1="115" y1="266" x2="530" y2="266" stroke="#6b4c8a"/>
      <line x1="115" y1="333" x2="530" y2="333" stroke="#946b21" stroke-dasharray="3 4"/>
      <line x1="115" y1="400" x2="530" y2="400" stroke="#24618a"/>
    </g>
    <g text-anchor="middle" fill="#17212b">
      <text x="145" y="126">-5</text><text x="235" y="126">0</text><text x="325" y="126">5</text><text x="415" y="126">10</text><text x="505" y="126">15</text>
      <text x="145" y="193">-4</text><text x="235" y="193">1</text><text x="325" y="193">6</text><text x="415" y="193">11</text><text x="505" y="193">16</text>
      <text x="145" y="260">-3</text><text x="235" y="260">2</text><text x="325" y="260">7</text><text x="415" y="260">12</text><text x="505" y="260">17</text>
      <text x="145" y="327">-2</text><text x="235" y="327">3</text><text x="325" y="327">8</text><text x="415" y="327">13</text><text x="505" y="327">18</text>
      <text x="145" y="394">-1</text><text x="235" y="394">4</text><text x="325" y="394">9</text><text x="415" y="394">14</text><text x="505" y="394">19</text>
    </g>
  </g>
  <line x1="570" y1="100" x2="570" y2="450" stroke="#b8b1a4" stroke-width="2"/>
  <g font-family="Verdana, sans-serif" fill="#17212b">
    <text x="610" y="140" font-family="Georgia, serif" font-size="22">Compatible CRT pair</text>
    <text x="610" y="188" font-size="16">x = 2 mod 6</text><text x="610" y="220" font-size="16">..., 2, 8, 14, 20, 26, ...</text>
    <text x="610" y="276" font-size="16">x = 8 mod 9</text><text x="610" y="308" font-size="16">..., -1, 8, 17, 26, 35, ...</text>
    <rect x="605" y="342" width="295" height="82" rx="6" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
    <text x="752" y="374" text-anchor="middle" font-size="20">x = 8 mod 18</text>
    <text x="752" y="402" text-anchor="middle" font-size="14" fill="#4b5560">shared gcd 3; period lcm = 18</text>
  </g>
</svg>