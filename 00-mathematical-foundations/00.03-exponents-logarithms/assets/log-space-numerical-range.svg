<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Numerical range and log-space computation</title>
  <desc id="desc">Three computation paths compare naive exponentiation overflow, naive all-term underflow, and max-shifted log-sum-exp. The stable path keeps one shifted term equal to one, so only negligible tail terms may underflow.</desc>
  <style>
    .bg { fill: #f8faf8; }
    .panel { fill: #ffffff; stroke: #30343b; stroke-width: 2; }
    .bad { fill: #fff2f1; stroke: #b23a48; stroke-width: 3; }
    .good { fill: #eef8f2; stroke: #287a4b; stroke-width: 3; }
    .neutral { fill: #f3f5f7; stroke: #59636e; stroke-width: 2; }
    .arrow { fill: none; stroke: #30343b; stroke-width: 2.5; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 8 7; }
    text { font-family: Georgia, serif; fill: #202428; font-size: 18px; letter-spacing: 0; }
    .small { font-size: 15px; }
    .label { font-size: 22px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30343b"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="620"/>
  <text x="480" y="38" text-anchor="middle" class="label">Log space preserves information outside direct exponential range</text>
  <text x="480" y="66" text-anchor="middle" class="small">Approximate thresholds vary by dtype and platform; query them with numpy.finfo.</text>

  <rect class="bad" x="55" y="105" width="850" height="125" rx="6"/>
  <text x="78" y="135" font-weight="700">Naive large positive inputs</text>
  <rect class="panel" x="85" y="157" width="190" height="48" rx="4"/>
  <text x="180" y="187" text-anchor="middle">[1000, 999, 998]</text>
  <path class="arrow" d="M285 181 H400"/>
  <text x="342" y="170" text-anchor="middle" class="small">exp each</text>
  <rect class="bad" x="410" y="157" width="170" height="48" rx="4"/>
  <text x="495" y="187" text-anchor="middle">[inf, inf, inf]</text>
  <path class="arrow" d="M590 181 H700"/>
  <rect class="bad" x="710" y="157" width="165" height="48" rx="4"/>
  <text x="792" y="187" text-anchor="middle">log(inf) = inf</text>

  <rect class="bad" x="55" y="255" width="850" height="125" rx="6"/>
  <text x="78" y="285" font-weight="700">Naive all-small inputs</text>
  <rect class="panel" x="85" y="307" width="190" height="48" rx="4"/>
  <text x="180" y="337" text-anchor="middle">[-1000, -1001]</text>
  <path class="arrow" d="M285 331 H400"/>
  <text x="342" y="320" text-anchor="middle" class="small">exp each</text>
  <rect class="bad" x="410" y="307" width="170" height="48" rx="4"/>
  <text x="495" y="337" text-anchor="middle">[0, 0]</text>
  <path class="arrow" d="M590 331 H700"/>
  <rect class="bad" x="710" y="307" width="165" height="48" rx="4"/>
  <text x="792" y="337" text-anchor="middle">log(0) = -inf</text>

  <rect class="good" x="55" y="405" width="850" height="150" rx="6"/>
  <text x="78" y="435" font-weight="700">Max-shifted path for either scale</text>
  <rect class="panel" x="85" y="462" width="190" height="58" rx="4"/>
  <text x="180" y="486" text-anchor="middle">m = max(x)</text>
  <text x="180" y="508" text-anchor="middle">shift x - m</text>
  <path class="arrow" d="M285 491 H388"/>
  <rect class="good" x="398" y="462" width="205" height="58" rx="4"/>
  <text x="500" y="486" text-anchor="middle">one exp term = 1</text>
  <text x="500" y="508" text-anchor="middle" class="small">tails are in [0, 1]</text>
  <path class="arrow" d="M613 491 H700"/>
  <rect class="good" x="710" y="462" width="165" height="58" rx="4"/>
  <text x="792" y="486" text-anchor="middle">m + log(sum)</text>
  <text x="792" y="508" text-anchor="middle">finite result</text>
  <text x="480" y="582" text-anchor="middle" class="small">A vanished shifted tail is often harmless because the retained maximum term anchors the sum at 1.</text>
  <text x="480" y="604" text-anchor="middle" class="small">When every naive term vanishes, the finite scale of the original inputs is lost.</text>
</svg>
