<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Finite and eventual growth-rate comparison</title>
  <desc id="desc">Plot on a double-log transformed vertical scale comparing natural log n, n to the tenth power, and two to the n. The polynomial exceeds the exponential across part of the finite window, but the exponential crosses between n equals 58 and 59 and then rises faster. Line styles and labels distinguish all curves.</desc>
  <style>
    .bg { fill: #fffdf8; }
    .grid { stroke: #dedbd3; stroke-width: 1; }
    .axis { stroke: #24272b; stroke-width: 2; }
    .logline { fill: none; stroke: #277da1; stroke-width: 5; }
    .poly { fill: none; stroke: #7b2cbf; stroke-width: 5; stroke-dasharray: 13 7; }
    .expo { fill: none; stroke: #d1495b; stroke-width: 5; stroke-dasharray: 3 7; }
    .guide { fill: none; stroke: #4f5d2f; stroke-width: 2; stroke-dasharray: 7 7; }
    text { font-family: Georgia, serif; fill: #202428; font-size: 19px; letter-spacing: 0; }
    .small { font-size: 15px; }
    .label { font-size: 22px; font-weight: 700; }
  </style>
  <rect class="bg" width="960" height="600"/>
  <text x="480" y="38" text-anchor="middle" class="label">A finite window can hide the eventual ordering</text>
  <text x="480" y="64" text-anchor="middle" class="small">Vertical coordinate is log10(1 + log10(1 + f(n))), used only to keep all curves visible.</text>
  <g aria-hidden="true">
    <line class="grid" x1="110" y1="120" x2="870" y2="120"/>
    <line class="grid" x1="110" y1="200" x2="870" y2="200"/>
    <line class="grid" x1="110" y1="280" x2="870" y2="280"/>
    <line class="grid" x1="110" y1="360" x2="870" y2="360"/>
    <line class="grid" x1="110" y1="440" x2="870" y2="440"/>
    <line class="grid" x1="110" y1="520" x2="870" y2="520"/>
    <line class="grid" x1="260" y1="90" x2="260" y2="520"/>
    <line class="grid" x1="410" y1="90" x2="410" y2="520"/>
    <line class="grid" x1="560" y1="90" x2="560" y2="520"/>
    <line class="grid" x1="710" y1="90" x2="710" y2="520"/>
    <line class="grid" x1="860" y1="90" x2="860" y2="520"/>
  </g>
  <line class="axis" x1="110" y1="520" x2="890" y2="520"/>
  <line class="axis" x1="110" y1="535" x2="110" y2="82"/>
  <text x="895" y="526">n</text>
  <text x="252" y="545" class="small">20</text>
  <text x="402" y="545" class="small">40</text>
  <text x="552" y="545" class="small">60</text>
  <text x="702" y="545" class="small">80</text>
  <text x="848" y="545" class="small">100</text>
  <polyline class="logline" points="117.5,520.0 147.5,477.7 185.0,469.2 222.5,465.2 260.0,462.7 297.5,460.9 335.0,459.6 372.5,458.5 410.0,457.6 447.5,456.8 485.0,456.1 522.5,455.5 560.0,455.0 597.5,454.5 635.0,454.0 672.5,453.6 710.0,453.3 747.5,452.9 785.0,452.6 822.5,452.3 860.0,452.0"/>
  <polyline class="poly" points="117.5,488.0 147.5,267.3 185.0,228.4 222.5,210.4 260.0,199.0 297.5,190.9 335.0,184.6 372.5,179.5 410.0,175.3 447.5,171.7 485.0,168.6 522.5,165.8 560.0,163.4 597.5,161.1 635.0,159.1 672.5,157.2 710.0,155.5 747.5,153.9 785.0,152.5 822.5,151.1 860.0,149.8"/>
  <polyline class="expo" points="117.5,472.6 147.5,407.7 185.0,351.1 222.5,312.4 260.0,283.0 297.5,259.4 335.0,239.6 372.5,222.6 410.0,207.7 447.5,194.4 485.0,182.5 522.5,171.6 560.0,161.6 597.5,152.3 635.0,143.7 672.5,135.7 710.0,128.2 747.5,121.1 785.0,114.4 822.5,108.0 860.0,102.0"/>
  <line class="guide" x1="552.5" y1="92" x2="552.5" y2="520"/>
  <circle cx="552.5" cy="163.7" r="8" fill="#fffdf8" stroke="#24272b" stroke-width="3"/>
  <text x="565" y="188" class="small">final integer crossover: n = 59</text>
  <text x="590" y="230" class="small">For tested integers n ≥ 59 in this window,</text>
  <text x="590" y="251" class="small">2^n exceeds n^10 and the gap keeps growing.</text>
  <line x1="145" y1="112" x2="195" y2="112" class="logline"/>
  <text x="207" y="119">ln n</text>
  <line x1="145" y1="148" x2="195" y2="148" class="poly"/>
  <text x="207" y="155">n^10</text>
  <line x1="145" y1="184" x2="195" y2="184" class="expo"/>
  <text x="207" y="191">2^n</text>
  <text x="480" y="580" text-anchor="middle" class="small">This picture illustrates finite behavior. The asymptotic theorem establishes eventual ordering.</text>
</svg>
