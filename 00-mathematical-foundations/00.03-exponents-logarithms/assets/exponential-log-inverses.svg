<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Exponential and logarithm inverse graphs</title>
  <desc id="desc">Coordinate plot of y equals e to the x and y equals natural log x reflected across the dashed line y equals x. The exponential approaches the horizontal axis and the logarithm approaches the vertical axis.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .grid { stroke: #d8d5ce; stroke-width: 1; }
    .axis { stroke: #262a2e; stroke-width: 2; }
    .tick { stroke: #262a2e; stroke-width: 1.5; }
    .exp { fill: none; stroke: #006d77; stroke-width: 5; }
    .log { fill: none; stroke: #b23a48; stroke-width: 5; stroke-dasharray: 12 7; }
    .mirror { fill: none; stroke: #5c677d; stroke-width: 3; stroke-dasharray: 4 8; }
    .asymptote { fill: none; stroke: #795548; stroke-width: 2; stroke-dasharray: 2 7; }
    text { font-family: Georgia, serif; fill: #202428; font-size: 20px; letter-spacing: 0; }
    .small { font-size: 16px; }
    .label { font-size: 22px; font-weight: 700; }
  </style>
  <rect class="bg" width="960" height="560" rx="0"/>
  <text x="480" y="38" text-anchor="middle" class="label">Exponential and logarithm are reflections across y = x</text>
  <g aria-hidden="true">
    <line class="grid" x1="100" y1="130" x2="850" y2="130"/>
    <line class="grid" x1="100" y1="220" x2="850" y2="220"/>
    <line class="grid" x1="100" y1="310" x2="850" y2="310"/>
    <line class="grid" x1="100" y1="400" x2="850" y2="400"/>
    <line class="grid" x1="190" y1="70" x2="190" y2="490"/>
    <line class="grid" x1="280" y1="70" x2="280" y2="490"/>
    <line class="grid" x1="370" y1="70" x2="370" y2="490"/>
    <line class="grid" x1="460" y1="70" x2="460" y2="490"/>
    <line class="grid" x1="550" y1="70" x2="550" y2="490"/>
    <line class="grid" x1="640" y1="70" x2="640" y2="490"/>
    <line class="grid" x1="730" y1="70" x2="730" y2="490"/>
  </g>
  <line class="axis" x1="100" y1="400" x2="875" y2="400"/>
  <line class="axis" x1="370" y1="500" x2="370" y2="58"/>
  <path class="axis" d="M875 400 l-12 -6 v12 z" fill="#262a2e"/>
  <path class="axis" d="M370 58 l-6 12 h12 z" fill="#262a2e"/>
  <text x="886" y="407">x</text>
  <text x="382" y="78">y</text>
  <line class="asymptote" x1="100" y1="400" x2="850" y2="400"/>
  <line class="asymptote" x1="370" y1="70" x2="370" y2="490"/>
  <text x="382" y="478" class="small">vertical asymptote x = 0</text>
  <path class="mirror" d="M120 490 L790 70"/>
  <rect class="bg" x="105" y="405" width="235" height="26"/>
  <text x="112" y="424" class="small">horizontal asymptote y = 0</text>
  <text x="760" y="104" class="small">y = x</text>
  <path class="exp" d="M105 395 C170 394 240 391 280 385 C320 379 345 370 370 355 C405 333 432 302 460 245 C485 194 510 132 535 73"/>
  <path class="log" d="M376 486 C381 438 388 410 400 386 C420 348 447 322 480 300 C531 267 588 244 650 225 C713 206 776 191 838 179"/>
  <circle cx="370" cy="355" r="6" fill="#006d77"/>
  <circle cx="460" cy="400" r="6" fill="#b23a48"/>
  <text x="384" y="348" class="small">(0, 1)</text>
  <text x="474" y="420" class="small">(1, 0)</text>
  <line x1="570" y1="104" x2="620" y2="104" class="exp"/>
  <text x="632" y="111">y = e^x</text>
  <line x1="570" y1="140" x2="620" y2="140" class="log"/>
  <text x="632" y="147">y = ln x</text>
  <text x="480" y="535" text-anchor="middle" class="small">Solid exponential and dashed logarithm exchange input and output coordinates.</text>
</svg>
