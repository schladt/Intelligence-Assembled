<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Dependent witnesses versus one shared witness</title>
  <desc id="desc">The left panel for for-all x there-exists y shows three input circles connected by solid arrows to different witness squares. The right panel for there-exists y for-all x shows three input circles connected by dashed arrows to one shared witness square.</desc>
  <defs>
    <marker id="solidArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#23646a"/>
    </marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b4d17"/>
    </marker>
    <style>
      .heading { font: 700 22px Georgia, serif; fill: #17212b; text-anchor: middle; }
      .formula { font: 19px "DejaVu Sans", sans-serif; fill: #17212b; text-anchor: middle; }
      .label { font: 16px Georgia, serif; fill: #24303d; text-anchor: middle; dominant-baseline: central; }
      .note { font: 15px Georgia, serif; fill: #344454; text-anchor: middle; }
    </style>
  </defs>

  <rect x="25" y="25" width="445" height="465" rx="6" fill="#edf6f3" stroke="#23646a" stroke-width="3"/>
  <rect x="510" y="25" width="445" height="465" rx="6" fill="#fff4df" stroke="#8b4d17" stroke-width="2" stroke-dasharray="10 6"/>

  <text x="247" y="66" class="heading">Dependent witness</text>
  <text x="247" y="99" class="formula">for all x, there exists y: R(x,y)</text>
  <text x="247" y="128" class="note">A different y may be chosen after x is known.</text>

  <circle cx="112" cy="205" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="112" cy="300" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="112" cy="395" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <text x="112" y="205" class="label">x1</text>
  <text x="112" y="300" class="label">x2</text>
  <text x="112" y="395" class="label">x3</text>

  <rect x="348" y="178" width="56" height="56" fill="#ffffff" stroke="#23646a" stroke-width="3"/>
  <rect x="348" y="273" width="56" height="56" fill="#ffffff" stroke="#23646a" stroke-width="3"/>
  <rect x="348" y="368" width="56" height="56" fill="#ffffff" stroke="#23646a" stroke-width="3"/>
  <text x="376" y="206" class="label">y1</text>
  <text x="376" y="301" class="label">y2</text>
  <text x="376" y="396" class="label">y3</text>

  <line x1="140" y1="205" x2="338" y2="205" stroke="#23646a" stroke-width="3" marker-end="url(#solidArrow)"/>
  <line x1="140" y1="300" x2="338" y2="300" stroke="#23646a" stroke-width="3" marker-end="url(#solidArrow)"/>
  <line x1="140" y1="395" x2="338" y2="395" stroke="#23646a" stroke-width="3" marker-end="url(#solidArrow)"/>

  <text x="732" y="66" class="heading">Shared witness</text>
  <text x="732" y="99" class="formula">there exists y, for all x: R(x,y)</text>
  <text x="732" y="128" class="note">One y must be chosen before any x varies.</text>

  <circle cx="598" cy="205" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="598" cy="300" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <circle cx="598" cy="395" r="27" fill="#ffffff" stroke="#17212b" stroke-width="2"/>
  <text x="598" y="205" class="label">x1</text>
  <text x="598" y="300" class="label">x2</text>
  <text x="598" y="395" class="label">x3</text>

  <rect x="842" y="273" width="62" height="62" fill="#ffffff" stroke="#8b4d17" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="873" y="304" class="label">y*</text>

  <line x1="626" y1="205" x2="832" y2="288" stroke="#8b4d17" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#dashArrow)"/>
  <line x1="626" y1="300" x2="832" y2="304" stroke="#8b4d17" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#dashArrow)"/>
  <line x1="626" y1="395" x2="832" y2="320" stroke="#8b4d17" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#dashArrow)"/>

  <text x="490" y="520" class="note">Circles are inputs; squares are witnesses. Solid and dashed arrows encode the two dependency rules.</text>
</svg>
