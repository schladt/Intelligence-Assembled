<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Syntax, semantics, and consequence as three distinct layers</title>
  <desc id="desc">Three numbered horizontal panels show formulas and parsing at the syntax layer, valuation and model truth at the semantics layer, and preservation from premises to conclusion at the consequence layer. Downward arrows are labeled interpret and quantify over models.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#24303d"/>
    </marker>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2c5f66"/>
    </pattern>
    <style>
      .heading { font: 700 24px Georgia, serif; fill: #17212b; }
      .body { font: 16px Georgia, serif; fill: #24303d; }
      .small { font: 14px Georgia, serif; fill: #344454; }
      .number { font: 700 20px Georgia, serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .formula { font: 18px "DejaVu Sans", sans-serif; fill: #17212b; text-anchor: middle; }
      .arrow-label { font: 700 14px Georgia, serif; fill: #24303d; text-anchor: middle; }
    </style>
  </defs>
  <rect x="18" y="18" width="924" height="112" rx="6" fill="#eef6f4" stroke="#2c5f66" stroke-width="2"/>
  <rect x="18" y="159" width="924" height="112" rx="6" fill="#fff5df" stroke="#9b5a17" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="18" y="300" width="924" height="112" rx="6" fill="#f3eff8" stroke="#5b4777" stroke-width="3"/>

  <circle cx="57" cy="55" r="22" fill="#2c5f66"/>
  <text x="57" y="55" class="number">1</text>
  <text x="94" y="59" class="heading">Syntax</text>
  <text x="94" y="88" class="body">Which strings are formulas? How are operators grouped? What is in scope?</text>
  <rect x="662" y="40" width="244" height="67" rx="4" fill="url(#dots)" stroke="#2c5f66" stroke-width="2"/>
  <text x="784" y="68" class="formula">(P and Q) implies R</text>
  <text x="784" y="93" class="small" text-anchor="middle">root: implication</text>

  <circle cx="57" cy="196" r="22" fill="#9b5a17"/>
  <text x="57" y="196" class="number">2</text>
  <text x="94" y="200" class="heading">Semantics</text>
  <text x="94" y="229" class="body">Under a valuation or interpretation, does the formula come out true?</text>
  <rect x="662" y="181" width="244" height="67" rx="4" fill="#ffffff" stroke="#9b5a17" stroke-width="2"/>
  <text x="684" y="210" class="small">P = T, Q = T, R = F</text>
  <text x="684" y="235" class="small">formula value = F</text>

  <circle cx="57" cy="337" r="22" fill="#5b4777"/>
  <text x="57" y="337" class="number">3</text>
  <text x="94" y="341" class="heading">Consequence</text>
  <text x="94" y="370" class="body">Can all premises be true while the conclusion is false?</text>
  <rect x="662" y="322" width="244" height="67" rx="4" fill="#ffffff" stroke="#5b4777" stroke-width="3"/>
  <text x="784" y="350" class="formula">premises  |=  conclusion</text>
  <text x="784" y="376" class="small" text-anchor="middle">no countermodel exists</text>

  <line x1="480" y1="130" x2="480" y2="156" stroke="#24303d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="412" y="132" width="136" height="20" fill="#ffffff"/>
  <text x="480" y="147" class="arrow-label">interpret</text>
  <line x1="480" y1="271" x2="480" y2="297" stroke="#24303d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="273" width="180" height="20" fill="#ffffff"/>
  <text x="480" y="288" class="arrow-label">quantify over cases</text>
</svg>
