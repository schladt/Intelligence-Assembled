<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Cantor diagonal construction for binary sequences</title>
  <desc id="desc">Six proposed binary sequence rows form a table. The diagonal bits are boxed. A final constructed row flips those diagonal bits, with arrows showing one guaranteed disagreement against each numbered row.</desc>
  <rect width="960" height="620" fill="#fbfaf6"/>
  <text x="480" y="42" text-anchor="middle" font-family="Verdana, sans-serif" font-size="25" font-weight="700" fill="#17212b">Flip the diagonal to escape every row</text>
  <text x="82" y="88" font-family="Verdana, sans-serif" font-size="18" fill="#4f5b63">proposed list</text>
  <g font-family="Verdana, sans-serif" font-size="22" fill="#17212b" text-anchor="middle">
    <text x="135" y="140">s0</text><text x="280" y="112">0</text><text x="370" y="112">1</text><text x="460" y="112">2</text><text x="550" y="112">3</text><text x="640" y="112">4</text><text x="730" y="112">5</text>
    <text x="280" y="140">0</text><text x="370" y="140">0</text><text x="460" y="140">1</text><text x="550" y="140">1</text><text x="640" y="140">0</text><text x="730" y="140">1</text>
    <text x="135" y="200">s1</text><text x="280" y="200">1</text><text x="370" y="200">0</text><text x="460" y="200">1</text><text x="550" y="200">0</text><text x="640" y="200">1</text><text x="730" y="200">0</text>
    <text x="135" y="260">s2</text><text x="280" y="260">1</text><text x="370" y="260">1</text><text x="460" y="260">0</text><text x="550" y="260">0</text><text x="640" y="260">0</text><text x="730" y="260">1</text>
    <text x="135" y="320">s3</text><text x="280" y="320">0</text><text x="370" y="320">1</text><text x="460" y="320">0</text><text x="550" y="320">1</text><text x="640" y="320">1</text><text x="730" y="320">1</text>
    <text x="135" y="380">s4</text><text x="280" y="380">1</text><text x="370" y="380">0</text><text x="460" y="380">0</text><text x="550" y="380">1</text><text x="640" y="380">0</text><text x="730" y="380">0</text>
    <text x="135" y="440">s5</text><text x="280" y="440">0</text><text x="370" y="440">1</text><text x="460" y="440">1</text><text x="550" y="440">0</text><text x="640" y="440">1</text><text x="730" y="440">1</text>
  </g>
  <g fill="none" stroke="#a33c2f" stroke-width="4">
    <rect x="258" y="113" width="44" height="38" rx="6"/>
    <rect x="348" y="173" width="44" height="38" rx="6"/>
    <rect x="438" y="233" width="44" height="38" rx="6"/>
    <rect x="528" y="293" width="44" height="38" rx="6"/>
    <rect x="618" y="353" width="44" height="38" rx="6"/>
    <rect x="708" y="413" width="44" height="38" rx="6"/>
  </g>
  <path d="M 280 151 L 280 493 M 370 211 L 370 493 M 460 271 L 460 493 M 550 331 L 550 493 M 640 391 L 640 493 M 730 451 L 730 493" stroke="#a33c2f" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <line x1="90" y1="475" x2="820" y2="475" stroke="#253746" stroke-width="3"/>
  <text x="135" y="525" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="700" fill="#17212b">t</text>
  <g font-family="Verdana, sans-serif" font-size="24" font-weight="700" fill="#a33c2f" text-anchor="middle">
    <text x="280" y="525">1</text><text x="370" y="525">1</text><text x="460" y="525">1</text><text x="550" y="525">0</text><text x="640" y="525">1</text><text x="730" y="525">0</text>
  </g>
  <text x="480" y="566" text-anchor="middle" font-family="Verdana, sans-serif" font-size="19" fill="#17212b">t(n) = 1 - s_n(n), so t differs from row n at coordinate n</text>
  <text x="480" y="598" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" fill="#4f5b63">boxes, dashed guides, and red bold digits identify the construction without color alone</text>
</svg>
