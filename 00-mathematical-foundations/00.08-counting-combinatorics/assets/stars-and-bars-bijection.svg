<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Stars and bars bijection for a weak composition</title>
  <desc id="desc">The tuple two, zero, three, one maps to two stars, two consecutive bars, three stars, one bar, and one star. Arrows connect each compartment to its tuple coordinate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#263238"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fcfaf5"/>
  <text x="48" y="52" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#172126">A separator string stores a weak composition</text>
  <text x="48" y="84" font-family="Verdana, sans-serif" font-size="15" fill="#40515a">Consecutive bars are meaningful: the empty compartment records a zero part.</text>
  <text x="480" y="155" font-family="Verdana, sans-serif" text-anchor="middle" font-size="30" font-weight="700" fill="#172126">(x₁, x₂, x₃, x₄) = (2, 0, 3, 1)</text>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <rect x="90" y="225" width="780" height="112" rx="6" fill="#ffffff" stroke="#263238" stroke-width="3"/>
    <text x="225" y="296" font-size="44" fill="#1d6b56">★ ★</text>
    <line x1="340" y1="242" x2="340" y2="320" stroke="#a23b2a" stroke-width="8"/>
    <line x1="395" y1="242" x2="395" y2="320" stroke="#a23b2a" stroke-width="8"/>
    <text x="535" y="296" font-size="44" fill="#1d6b56">★ ★ ★</text>
    <line x1="690" y1="242" x2="690" y2="320" stroke="#a23b2a" stroke-width="8"/>
    <text x="785" y="296" font-size="44" fill="#1d6b56">★</text>
    <g fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow)">
      <line x1="225" y1="375" x2="225" y2="330"/>
      <line x1="368" y1="375" x2="368" y2="330"/>
      <line x1="535" y1="375" x2="535" y2="330"/>
      <line x1="785" y1="375" x2="785" y2="330"/>
    </g>
    <text x="225" y="415" font-size="19" font-weight="700">2 stars</text>
    <text x="368" y="415" font-size="19" font-weight="700">0 stars</text>
    <text x="535" y="415" font-size="19" font-weight="700">3 stars</text>
    <text x="785" y="415" font-size="19" font-weight="700">1 star</text>
  </g>
  <text x="480" y="482" font-family="Verdana, sans-serif" text-anchor="middle" font-size="17" fill="#40515a">Choose 3 bar positions among 6 + 3 positions: C(9, 3).</text>
</svg>