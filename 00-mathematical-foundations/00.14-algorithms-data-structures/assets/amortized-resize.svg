<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Dynamic-array append costs under capacity doubling</title>
  <desc id="desc">Bars show ordinary writes plus resize copies for the first sixteen appends. Expensive spikes occur at powers of two while cumulative cost remains below three times the append count.</desc>
  <defs>
    <style>
      .title { font: 700 27px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #334155; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 5; }
      .label { font: 14px system-ui, sans-serif; fill: #334155; }
      .head { font: 700 16px system-ui, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1000" height="590" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" class="title">One append can spike while the sequence stays linear</text>
  <text x="500" y="69" text-anchor="middle" class="subtitle">Capacity doubles: bar height = one write + copied live items</text>

  <line x1="85" y1="465" x2="930" y2="465" class="axis"/>
  <line x1="85" y1="110" x2="85" y2="465" class="axis"/>
  <line x1="85" y1="385" x2="930" y2="385" class="grid"/>
  <line x1="85" y1="305" x2="930" y2="305" class="grid"/>
  <line x1="85" y1="225" x2="930" y2="225" class="grid"/>
  <line x1="85" y1="145" x2="930" y2="145" class="grid"/>
  <text x="65" y="470" text-anchor="end" class="label">0</text>
  <text x="65" y="390" text-anchor="end" class="label">4</text>
  <text x="65" y="310" text-anchor="end" class="label">8</text>
  <text x="65" y="230" text-anchor="end" class="label">12</text>
  <text x="65" y="150" text-anchor="end" class="label">16</text>
  <text x="25" y="290" transform="rotate(-90 25 290)" text-anchor="middle" class="head">append cost</text>

  <g fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="105" y="445" width="34" height="20"/>
    <rect x="157" y="425" width="34" height="40"/>
    <rect x="209" y="405" width="34" height="60"/>
    <rect x="261" y="445" width="34" height="20"/>
    <rect x="313" y="365" width="34" height="100"/>
    <rect x="365" y="445" width="34" height="20"/>
    <rect x="417" y="445" width="34" height="20"/>
    <rect x="469" y="445" width="34" height="20"/>
    <rect x="521" y="285" width="34" height="180"/>
    <rect x="573" y="445" width="34" height="20"/>
    <rect x="625" y="445" width="34" height="20"/>
    <rect x="677" y="445" width="34" height="20"/>
    <rect x="729" y="445" width="34" height="20"/>
    <rect x="781" y="445" width="34" height="20"/>
    <rect x="833" y="445" width="34" height="20"/>
    <rect x="885" y="445" width="34" height="20"/>
  </g>

  <g class="label" text-anchor="middle">
    <text x="122" y="490">1</text><text x="174" y="490">2</text>
    <text x="226" y="490">3</text><text x="278" y="490">4</text>
    <text x="330" y="490">5</text><text x="382" y="490">6</text>
    <text x="434" y="490">7</text><text x="486" y="490">8</text>
    <text x="538" y="490">9</text><text x="590" y="490">10</text>
    <text x="642" y="490">11</text><text x="694" y="490">12</text>
    <text x="746" y="490">13</text><text x="798" y="490">14</text>
    <text x="850" y="490">15</text><text x="902" y="490">16</text>
  </g>
  <text x="500" y="525" text-anchor="middle" class="head">append number</text>

  <rect x="205" y="540" width="590" height="34" rx="17" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="500" y="563" text-anchor="middle" class="head">Across m appends: m writes + fewer than 2m copies &lt; 3m total work</text>

  <g class="label" fill="#7c2d12">
    <text x="330" y="345" text-anchor="middle">copy 4</text>
    <text x="538" y="265" text-anchor="middle">copy 8</text>
  </g>
</svg>
