<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Knapsack states form a dependency graph with a recovery path</title>
  <desc id="desc">A small grid of dynamic-programming states shows exclude and include dependencies flowing from earlier item rows, with a bold path tracing recovered choices backward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="recover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 27px system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 16px system-ui, sans-serif; fill: #334155; }
      .head { font: 700 17px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 14px system-ui, sans-serif; fill: #1e293b; }
      .cell { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; }
      .dependency { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .recovery { stroke: #b91c1c; stroke-width: 4; fill: none; marker-end: url(#recover); }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#f8fafc"/>
  <text x="500" y="42" text-anchor="middle" class="title">Dynamic programming is a dependency graph</text>
  <text x="500" y="70" text-anchor="middle" class="subtitle">State D[i,w]: best value from the first i items within capacity w</text>

  <text x="115" y="128" text-anchor="middle" class="head">items i</text>
  <text x="535" y="108" text-anchor="middle" class="head">capacity w</text>
  <g class="head" text-anchor="middle">
    <text x="280" y="140">0</text><text x="410" y="140">2</text>
    <text x="540" y="140">3</text><text x="670" y="140">5</text>
    <text x="800" y="140">7</text>
  </g>
  <g class="head" text-anchor="middle">
    <text x="170" y="195">0</text><text x="170" y="285">1</text>
    <text x="170" y="375">2</text><text x="170" y="465">3</text>
  </g>

  <g>
    <rect x="230" y="158" width="100" height="54" class="cell"/><text x="280" y="191" text-anchor="middle" class="body">D[0,0]=0</text>
    <rect x="360" y="158" width="100" height="54" class="cell"/><text x="410" y="191" text-anchor="middle" class="body">D[0,2]=0</text>
    <rect x="490" y="158" width="100" height="54" class="cell"/><text x="540" y="191" text-anchor="middle" class="body">D[0,3]=0</text>
    <rect x="620" y="158" width="100" height="54" class="cell"/><text x="670" y="191" text-anchor="middle" class="body">D[0,5]=0</text>
    <rect x="750" y="158" width="100" height="54" class="cell"/><text x="800" y="191" text-anchor="middle" class="body">D[0,7]=0</text>

    <rect x="230" y="248" width="100" height="54" class="cell"/><text x="280" y="281" text-anchor="middle" class="body">D[1,0]=0</text>
    <rect x="360" y="248" width="100" height="54" class="cell"/><text x="410" y="281" text-anchor="middle" class="body">D[1,2]=3</text>
    <rect x="490" y="248" width="100" height="54" class="cell"/><text x="540" y="281" text-anchor="middle" class="body">D[1,3]=3</text>
    <rect x="620" y="248" width="100" height="54" class="cell"/><text x="670" y="281" text-anchor="middle" class="body">D[1,5]=3</text>
    <rect x="750" y="248" width="100" height="54" class="cell"/><text x="800" y="281" text-anchor="middle" class="body">D[1,7]=3</text>

    <rect x="230" y="338" width="100" height="54" class="cell"/><text x="280" y="371" text-anchor="middle" class="body">D[2,0]=0</text>
    <rect x="360" y="338" width="100" height="54" class="cell"/><text x="410" y="371" text-anchor="middle" class="body">D[2,2]=3</text>
    <rect x="490" y="338" width="100" height="54" class="cell"/><text x="540" y="371" text-anchor="middle" class="body">D[2,3]=4</text>
    <rect x="620" y="338" width="100" height="54" class="cell"/><text x="670" y="371" text-anchor="middle" class="body">D[2,5]=7</text>
    <rect x="750" y="338" width="100" height="54" class="cell"/><text x="800" y="371" text-anchor="middle" class="body">D[2,7]=7</text>

    <rect x="230" y="428" width="100" height="54" class="cell"/><text x="280" y="461" text-anchor="middle" class="body">D[3,0]=0</text>
    <rect x="360" y="428" width="100" height="54" class="cell"/><text x="410" y="461" text-anchor="middle" class="body">D[3,2]=3</text>
    <rect x="490" y="428" width="100" height="54" class="cell"/><text x="540" y="461" text-anchor="middle" class="body">D[3,3]=4</text>
    <rect x="620" y="428" width="100" height="54" class="cell"/><text x="670" y="461" text-anchor="middle" class="body">D[3,5]=8</text>
    <rect x="750" y="428" width="100" height="54" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5" rx="8"/><text x="800" y="461" text-anchor="middle" class="head">D[3,7]=12</text>
  </g>

  <path d="M800 422 L800 309" class="dependency"/>
  <path d="M800 422 L540 309" class="dependency"/>
  <path d="M670 332 L670 309" class="dependency"/>
  <path d="M670 332 L410 309" class="dependency"/>

  <path d="M800 428 C720 405 625 395 550 392" class="recovery"/>
  <path d="M540 338 C470 318 365 309 290 302" class="recovery"/>

  <rect x="130" y="535" width="740" height="72" rx="14" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="160" y="564" class="head">Two dependencies per legal state:</text>
  <text x="160" y="590" class="body">exclude: D[i-1,w]   |   include: D[i-1,w-weight] + value</text>
  <line x1="610" y1="558" x2="665" y2="558" class="recovery"/>
  <text x="680" y="564" class="body">recover: take item 2, then 1</text>
</svg>
